[alembic]
script_location = db/migrations

# The URL is supplied by env.py from $DATABASE_URL rather than hardcoded here,
# so credentials never live in the repo (§7 secret handling) and the same config
# targets local Postgres, CI, and a throwaway SQLite database.
sqlalchemy.url =

# Migration filenames sort chronologically and read as a changelog.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
