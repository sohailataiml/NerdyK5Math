[project]
name = "socratic-tutor"
version = "0.1.0"
description = "Adaptive Socratic Tutor + Auto-Grader — K-12 math tutoring pipeline"
requires-python = ">=3.12"

# Dependencies are pinned in requirements.txt / requirements-dev.txt.
# This project is run from the repo root via pythonpath, not installed as a wheel.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live Postgres (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# RUF002: prose docstrings legitimately use en/em dashes; the "ambiguous
# character" warning fights typography rather than catching bugs.
ignore = ["A003", "RUF002"]

[tool.ruff.lint.per-file-ignores]
# Migration bodies are generated by `alembic revision --autogenerate`. Hand-
# wrapping the emitted DDL to satisfy a line limit invites transcription errors
# in exactly the code that must match the models byte for byte — and the next
# autogenerated file would reintroduce it anyway. Everything else still applies.
"db/migrations/versions/*.py" = ["E501"]
# B008 forbids function calls in argument defaults, which is exactly how FastAPI
# declares dependencies (`db: Session = Depends(get_db)`). The rule is right in
# general and wrong here; scoped to the API modules so it still applies
# everywhere a mutable default would be a real bug.
"services/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["packages", "services", "eval", "tests"]

[[tool.mypy.overrides]]
# Neither ships type stubs or a py.typed marker.
module = ["pgvector.*", "sympy.*"]
ignore_missing_imports = true


# ---------------------------------------------------------------------------
# Import contracts (M0.1). These encode the three structural rules from
# Implementation-Plan.md §1 so they fail the build rather than relying on
# review discipline.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["packages", "services", "eval"]
# Required because the SDK contract names an external package (anthropic).
include_external_packages = true

# Rule 1 (§6): stage modules never import each other. All composition happens
# in orchestrator/graph.py, so that retries/timeouts/logging live in one place.
[[tool.importlinter.contracts]]
name = "Pipeline stages are independent of each other"
type = "independence"
modules = [
    "services.orchestrator.stages.diagnose",
    "services.orchestrator.stages.retrieve",
    "services.orchestrator.stages.generate",
    "services.orchestrator.stages.leakcheck",
    "services.orchestrator.stages.grade",
    "services.orchestrator.stages.safety",
]

# Rule 2 (M0.4): no stage calls the model SDK directly. Everything routes
# through packages.llm so no call escapes LLMCall logging or tier config.
[[tool.importlinter.contracts]]
name = "Model SDK is reachable only through packages.llm"
type = "forbidden"
source_modules = ["services", "packages.domain", "packages.prompts", "packages.fallbacks"]
forbidden_modules = ["anthropic"]

# Rule 3: the domain layer stays pure — no I/O, no model calls, no services.
# This is what keeps §5 entities testable as plain values.
[[tool.importlinter.contracts]]
name = "Domain layer is pure"
type = "forbidden"
source_modules = ["packages.domain"]
forbidden_modules = ["services", "packages.llm", "packages.curriculum", "anthropic", "httpx"]

# Rule 4 (M0.5): the eval harness is dev-time tooling that reads production code,
# never the reverse. A production stage importing a suite or a scoring function
# would make eval datasets a runtime dependency and let a metric definition drift
# into serving behaviour.
[[tool.importlinter.contracts]]
name = "Production code does not import the eval harness"
type = "forbidden"
source_modules = ["packages", "services"]
forbidden_modules = ["eval"]
